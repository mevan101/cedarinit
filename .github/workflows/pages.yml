name: GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
# Pages must use "GitHub Actions" as the source (Settings → Pages). This does not
# touch DNS or cedar-initiative.org. The project site is served from /cedarinit/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # configure-pages reports /cedarinit for this project site, and / for a user site.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/cedarinit' }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
